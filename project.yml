## Pocket Beings, XcodeGen project spec.
##
## The .xcodeproj is generated rather than committed: it is authored on Windows
## where it cannot be opened, and a hand-edited pbxproj is the single most
## conflict-prone file in an iOS repo.
##
## Every setting that looks oddly specific is one that cost a CI cycle to
## learn on the previous two apps in this account.

name: PocketBeings

options:
  bundleIdPrefix: com.mattbusel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PocketBeings:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.pocketbeings
        # No spaces: PRODUCT_NAME is a path component and a space breaks the
        # default TEST_HOST expansion with "Could not find test host".
        PRODUCT_NAME: PocketBeings
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Beings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

    # No entitlements file. No Game Center in v1: an app with Game Center
    # config that has never been published cannot be added to a review
    # submission, and the API only says "not in valid state".

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocket Beings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        # No custom cryptography. Declared so an upload never parks in
        # "Missing Compliance".
        ITSAppUsesNonExemptEncryption: false

  PocketBeingsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: PocketBeings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.pocketbeings.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PocketBeings.app/PocketBeings"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

  PocketBeingsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ScreenshotTests
    dependencies:
      - target: PocketBeings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbusel.pocketbeings.uitests
        TEST_TARGET_NAME: PocketBeings
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

schemes:
  PocketBeings:
    build:
      targets:
        PocketBeings: all
        PocketBeingsTests: [test]
        PocketBeingsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PocketBeingsTests
        - PocketBeingsUITests
    archive:
      config: Release
